<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  fill="none"
>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="fav-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Gradients for 3D Isometric Cube -->
    <linearGradient id="fav-top-grad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="fav-right-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="fav-left-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Speed Lines Gradient Fading In -->
    <linearGradient id="fav-speed-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#F97316" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="100" height="100" rx="22" fill="url(#fav-bg)" />

  <!-- Centered Logo Content (shifted slightly for perfect visual balance) -->
  <g transform="translate(1, 0)">
    <!-- Speed Lines -->
    <path
      d="M 8,37 L 33,37"
      stroke="url(#fav-speed-grad)"
      stroke-width="3.5"
      stroke-linecap="round"
    />
    <path
      d="M 4,47 L 41,47"
      stroke="url(#fav-speed-grad)"
      stroke-width="4.5"
      stroke-linecap="round"
    />
    <path
      d="M 10,57 L 36,57"
      stroke="url(#fav-speed-grad)"
      stroke-width="4.5"
      stroke-linecap="round"
    />
    <path
      d="M 16,67 L 31,67"
      stroke="url(#fav-speed-grad)"
      stroke-width="3.5"
      stroke-linecap="round"
    />

    <!-- 3D Isometric Cube -->
    <!-- Top Face -->
    <polygon points="60,22 85,33 60,45 35,33" fill="url(#fav-top-grad)" />
    <!-- Right Face -->
    <polygon points="60,45 85,33 85,66 60,78" fill="url(#fav-right-grad)" />
    <!-- Left Face -->
    <polygon points="35,33 60,45 60,78 35,66" fill="url(#fav-left-grad)" />
  </g>
</svg>
