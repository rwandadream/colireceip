name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, build & tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gaff_ci?sslmode=disable
      JWT_SECRET: ci-temporary-jwt-secret-for-github-actions-tests
      INITIAL_ADMIN_EMAIL: admin@groupe-gaff-ci.invalid
      INITIAL_ADMIN_PASSWORD: ci-temporary-admin-password
      INITIAL_ADMIN_PHONE: "+22399999999"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gaff_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - name: Bootstrap initial administrator (idempotent)
        run: npm run bootstrap-admin
      - name: Run unit / engine suites
        run: |
          npm run test-sync-logic
          npm run test-sync-engine
          npm run test-reconnect-sync
          npm run test-payment-double-submit
          npm run test-parcel-create-local-first
          npm run test-parcel-financials
          npm run test-settings-sync
          npm run test-excel-exports
          npm run test-data-api
          npm run test-admin-auth
          npm run test-user-api
          npm run test-tracking-collision
          npm run test-payment-idempotency
          npm run test-payment-persistence
          npm run test-payment-deletion
          npm run test-crud-persistence
          npm run test-director-delete-guard